<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary">📊 Statistiques des Diagnostics</h2>
        <a href="/dashboard" class="btn btn-outline-secondary">← Retour</a>
    </div>

    <!-- Cartes résumé -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card text-center shadow-sm border-0 bg-primary text-white py-3">
                <h3>{{ total }}</h3>
                <p class="mb-0">Total Patients</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center shadow-sm border-0 bg-danger text-white py-3">
                <h3>{{ malignant }}</h3>
                <p class="mb-0">Malignant 🔴</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center shadow-sm border-0 bg-success text-white py-3">
                <h3>{{ benign }}</h3>
                <p class="mb-0">Benign 🟢</p>
            </div>
        </div>
    </div>

    <!-- Graphiques -->
    <div class="row">
        <!-- Pie Chart -->
        <div class="col-md-6">
            <div class="card shadow-sm p-4">
                <h5 class="text-center mb-3">Répartition Malignant / Benign</h5>
                <canvas id="pieChart" height="250"></canvas>
            </div>
        </div>
        <!-- Bar Chart -->
        <div class="col-md-6">
            <div class="card shadow-sm p-4">
                <h5 class="text-center mb-3">Nombre de cas par résultat</h5>
                <canvas id="barChart" height="250"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    const malignant = {{ malignant }};
    const benign = {{ benign }};

    // Pie Chart
    new Chart(document.getElementById('pieChart'), {
        type: 'pie',
        data: {
            labels: ['Malignant', 'Benign'],
            datasets: [{
                data: [malignant, benign],
                backgroundColor: ['#dc3545', '#28a745'],
                borderWidth: 2
            }]
        },
        options: {
            plugins: {
                legend: { position: 'bottom' }
            }
        }
    });

    // Bar Chart
    new Chart(document.getElementById('barChart'), {
        type: 'bar',
        data: {
            labels: ['Malignant', 'Benign'],
            datasets: [{
                label: 'Nombre de patients',
                data: [malignant, benign],
                backgroundColor: ['#dc3545', '#28a745'],
                borderRadius: 8
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: { stepSize: 1 }
                }
            },
            plugins: {
                legend: { display: false }
            }
        }
    });
</script>

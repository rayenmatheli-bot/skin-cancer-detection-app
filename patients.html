<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-info">📋 Historique des Patients</h2>
        <a href="/dashboard" class="btn btn-outline-dark">Retour</a>
    </div>

    <input type="text" id="searchInput" onkeyup="searchTable()" placeholder="🔍 Chercher un patient par nom..." class="form-control mb-4 shadow-sm">

    <div class="table-responsive shadow-sm">
        <table class="table table-hover table-bordered bg-white" id="patientsTable">
            <thead class="table-dark">
                <tr>
                    <th>Nom</th>
                    <th>Age</th>
                    <th>Résultat</th>
                    <th>Probabilité</th>
                    <th>Image</th>
                </tr>
            </thead>
            <tbody>
                {% for p in patients %}
                <tr>
                    <td class="fw-bold">{{ p.name }}</td>
                    <td>{{ p.age }}</td>
                    <td>
                        {% if p.result == 'Malignant' %}
                            <span class="badge bg-danger">Malignant</span>
                        {% else %}
                            <span class="badge bg-success">Benign</span>
                        {% endif %}
                    </td>
                    <td>{{ (p.probability * 100) | round(2) }}%</td>
                    <td><img src="{{ p.image_path }}" width="80" class="rounded"></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<script>
function searchTable() {
    var input, filter, table, tr, td, i, txtValue;
    input = document.getElementById("searchInput");
    filter = input.value.toUpperCase();
    table = document.getElementById("patientsTable");
    tr = table.getElementsByTagName("tr");

    for (i = 1; i < tr.length; i++) {
        td = tr[i].getElementsByTagName("td")[0]; // Yfarkes fel colonne loula (Nom)
        if (td) {
            txtValue = td.textContent || td.innerText;
            if (txtValue.toUpperCase().indexOf(filter) > -1) {
                tr[i].style.display = "";
            } else {
                tr[i].style.display = "none";
            }
        }
    }
}
</script>
